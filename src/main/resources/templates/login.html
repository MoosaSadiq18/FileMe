U<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #message {
            margin-top: 20px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: dodgerblue;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4cae4c;
        }

    </style>
</head>

<body>
<div class="container">
    <h2 style="color: black">FileGo</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="login_email">Email</label>
            <input type="text" id="login_email" name="username" required>
        </div>

        <div class="form-group">
            <label for="login_pass">Password</label>
            <input type="password" id="login_pass" name="password" required>
        </div>
        <button type="submit">Login</button>

        <div>
            <p>Don't have an account? <a href="/signup">Signup</a> </p>
        </div>
    </form>
    <p id="message"></p>
</div>

<script src="login.js"></script>
</body>

</html>
